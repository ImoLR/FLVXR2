mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
unified-delay: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
    - localhost.ptlogin2.qq.com
    - '*.msftncsi.com'
    - '*.msftconnecttest.com'
    - +.stun.*.*
    - +.stun.*.*.*
    - +.stun.*.*.*.*
    - +.stun.*.*.*.*.*
    - lens.l.google.com
    - '*.n.n.srv.nintendo.net'
    - +.stun.playstation.net
    - xbox.*.*.microsoft.com
    - '*.*.xboxlive.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  nameserver-policy:
    geosite:cn,private:
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query
    xbox.*.*.microsoft.com,*.*.xboxlive.com,*.msftncsi.com,*.msftconnecttest.com:
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query
    +.stun.*.*,+.stun.*.*.*,+.stun.*.*.*.*,+.stun.*.*.*.*.*,*.n.n.srv.nintendo.net,+.stun.playstation.net:
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query
proxies: []
proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - DIRECT
  - name: "\U0001F4CC 公司"
    type: select
    proxies:
