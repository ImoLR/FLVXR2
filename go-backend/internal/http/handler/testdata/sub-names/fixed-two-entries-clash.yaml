mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
unified-delay: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
    - localhost.ptlogin2.qq.com
    - '*.msftncsi.com'
    - '*.msftconnecttest.com'
    - +.stun.*.*
    - +.stun.*.*.*
    - +.stun.*.*.*.*
    - +.stun.*.*.*.*.*
    - lens.l.google.com
    - '*.n.n.srv.nintendo.net'
    - +.stun.playstation.net
    - xbox.*.*.microsoft.com
    - '*.*.xboxlive.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://1.1.1.1/dns-query#节点选择
    - https://8.8.8.8/dns-query#节点选择
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  nameserver-policy:
    geosite:cn,private:
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query
    xbox.*.*.microsoft.com,*.*.xboxlive.com,*.msftncsi.com,*.msftconnecttest.com:
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query
    +.stun.*.*,+.stun.*.*.*,+.stun.*.*.*.*,+.stun.*.*.*.*.*,*.n.n.srv.nintendo.net,+.stun.playstation.net:
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query
proxies:
  - name: 游戏加速 · 上海联通入口
    type: ss
    server: 198.51.100.10
    port: 20009
    cipher: 2022-blake3-aes-128-gcm
    password: AQEBAQEBAQEBAQEBAQEBAQ==:AQEBAQEBAQEBAQEBAQEBAQ==
    udp: true
  - name: 游戏加速 · 广州电信入口
    type: ss
    server: 198.51.100.30
    port: 20019
    cipher: 2022-blake3-aes-128-gcm
    password: AQEBAQEBAQEBAQEBAQEBAQ==:AQEBAQEBAQEBAQEBAQEBAQ==
    udp: true
  - name: 游戏加速（直连）
    type: ss
    server: 203.0.113.21
    port: 30002
    cipher: 2022-blake3-aes-128-gcm
    password: AQEBAQEBAQEBAQEBAQEBAQ==:AQEBAQEBAQEBAQEBAQEBAQ==
    udp: true
